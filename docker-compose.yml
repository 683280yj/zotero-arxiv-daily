services:
  zotero-arxiv-daily:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/zotero-arxiv-daily:latest
    container_name: zotero-arxiv-daily
    network_mode: bridge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RECEIVER: ${RECEIVER:-yggcmm@outlook.com}
      LANGUAGE: ${LANGUAGE:-Chinese}
      ARXIV_QUERY: ${ARXIV_QUERY:-cs.AI+cs.CV+cs.LG+cs.CL}
      MAX_PAPER_NUM: ${MAX_PAPER_NUM:-5}
      SEND_EMPTY: ${SEND_EMPTY:-false}
      USE_LLM_API: ${USE_LLM_API:-true}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 8 * * *}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      # - ./models:/app/models  # LLM 模型缓存；仅在本地推理时需要
      - /etc/localtime:/etc/localtime:ro
    command: >
      bash -lc "
      rm -f /var/run/crond.pid /var/run/cron.pid &&
      printenv > /etc/environment &&
      printf '%s\n' \"$${CRON_SCHEDULE} root cd /app && /usr/local/bin/uv run main.py >> /proc/1/fd/1 2>> /proc/1/fd/2\" > /etc/cron.d/zotero-job &&
      chmod 0644 /etc/cron.d/zotero-job &&
      exec cron -f
      "
